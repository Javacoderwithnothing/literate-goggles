<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100b1c">
  <title>Sign in · Netherlight SMP</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0812;
      --panel: #171122;
      --text: #f7f2ff;
      --muted: #b9accd;
      --purple: #9333ea;
      --border: rgba(216,180,254,.2);
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; padding: 24px;
      display: grid; place-items: center;
      font: 16px/1.55 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: radial-gradient(ellipse at 50% 0%, #4c1d9560, transparent 52%), var(--bg);
    }
    .shell { width: min(440px, 100%); }
    .brand { display: flex; justify-content: center; align-items: center; gap: 11px; margin-bottom: 22px; font-weight: 900; letter-spacing: .04em; }
    .mark { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 13px; background: linear-gradient(135deg,#7e22ce,#c084fc); font-size: 1.35rem; }
    .panel { background: rgba(23,17,34,.96); border: 1px solid var(--border); border-radius: 22px; padding: clamp(22px, 6vw, 34px); box-shadow: 0 22px 80px #0005; }
    h1 { text-align: center; font-size: 1.8rem; line-height: 1.2; margin: 0 0 8px; letter-spacing: -.035em; }
    .intro { text-align: center; color: var(--muted); margin: 0 0 25px; font-size: .94rem; }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; padding: 4px; gap: 4px; border: 1px solid var(--border); border-radius: 12px; background: #09070f77; margin-bottom: 22px; }
    .tab { background: transparent; color: var(--muted); border: 0; border-radius: 9px; padding: 10px; font: inherit; font-weight: 750; cursor: pointer; }
    .tab[aria-selected="true"] { background: #9333ea35; color: #f3e8ff; box-shadow: inset 0 0 0 1px #c084fc35; }
    label { display: block; font-size: .88rem; font-weight: 700; margin: 14px 0 7px; }
    input { width: 100%; padding: 12px 13px; border: 1px solid var(--border); border-radius: 11px; color: var(--text); background: #0b0812; font: inherit; outline: none; }
    input:focus { border-color: #c084fc; box-shadow: 0 0 0 3px #a855f722; }
    .button { width: 100%; border: 1px solid transparent; border-radius: 11px; padding: 12px 14px; font: inherit; font-weight: 800; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; }
    .primary { color: white; background: linear-gradient(135deg,#9333ea,#6d28d9); margin-top: 20px; }
    .google { color: #222; background: #fff; margin-top: 13px; }
    .g { font-size: 1.25rem; font-weight: 900; background: conic-gradient(from -45deg,#4285f4 0 25%,#34a853 0 50%,#fbbc05 0 75%,#ea4335 0); color: transparent; background-clip: text; -webkit-background-clip: text; }
    .divider { display: flex; align-items: center; gap: 12px; margin-top: 17px; color: var(--muted); font-size: .82rem; }
    .divider::before, .divider::after { content: ""; height: 1px; flex: 1; background: var(--border); }
    .message { min-height: 1.5em; margin-top: 15px; font-size: .88rem; color: #d8b4fe; }
    .back { display: block; text-align: center; color: var(--muted); text-decoration: none; margin-top: 20px; font-size: .9rem; }
    .back:hover { color: white; }
    .fine { margin: 18px 0 0; color: var(--muted); font-size: .77rem; text-align: center; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand"><span class="mark" aria-hidden="true">✦</span><span>NETHERLIGHT SMP</span></div>
    <section class="panel" aria-labelledby="page-title">
      <h1 id="page-title">Welcome to Netherlight</h1>
      <p class="intro" id="page-intro">Sign in to continue to your player account.</p>

      <div class="tabs" role="tablist" aria-label="Account action">
        <button class="tab" id="signin-tab" role="tab" aria-selected="true" type="button">Sign in</button>
        <button class="tab" id="signup-tab" role="tab" aria-selected="false" type="button">Create account</button>
      </div>

      <form id="email-form">
        <div id="name-field" class="hidden">
          <label for="display-name">Player display name</label>
          <input id="display-name" name="display-name" autocomplete="nickname" maxlength="32" placeholder="Your name">
        </div>
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" minlength="8" placeholder="At least 8 characters" required>
        <button class="button primary" id="email-submit" type="submit">Sign in</button>
      </form>

      <div class="divider"><span>or</span></div>
      <button class="button google" id="google-button" type="button"><span class="g" aria-hidden="true">G</span> Continue with Google</button>
      <div class="message" id="message" role="status" aria-live="polite"></div>
      <p class="fine">Secure account access will be enabled after Firebase Authentication is configured. This page does not collect or store passwords yet.</p>
    </section>
    <a class="back" href="index.html">← Back to Netherlight SMP</a>
  </main>

  <script>
    // UI-only starter: no account is created and no password is transmitted.
    // Connect Firebase Authentication before enabling real sign-in or registration.
    let mode = 'signin';
    const signinTab = document.getElementById('signin-tab');
    const signupTab = document.getElementById('signup-tab');
    const nameField = document.getElementById('name-field');
    const displayName = document.getElementById('display-name');
    const password = document.getElementById('password');
    const emailSubmit = document.getElementById('email-submit');
    const pageTitle = document.getElementById('page-title');
    const pageIntro = document.getElementById('page-intro');
    const message = document.getElementById('message');

    function setMode(nextMode) {
      mode = nextMode;
      const isSignup = mode === 'signup';
      signinTab.setAttribute('aria-selected', String(!isSignup));
      signupTab.setAttribute('aria-selected', String(isSignup));
      nameField.classList.toggle('hidden', !isSignup);
      displayName.required = isSignup;
      password.autocomplete = isSignup ? 'new-password' : 'current-password';
      emailSubmit.textContent = isSignup ? 'Create account' : 'Sign in';
      pageTitle.textContent = isSignup ? 'Create your account' : 'Welcome to Netherlight';
      pageIntro.textContent = isSignup ? 'Create an account to join the community.' : 'Sign in to continue to your player account.';
      message.textContent = '';
    }

    signinTab.addEventListener('click', () => setMode('signin'));
    signupTab.addEventListener('click', () => setMode('signup'));

    document.getElementById('email-form').addEventListener('submit', (event) => {
      event.preventDefault();
      message.textContent = 'Authentication is not configured yet. No account was created and no details were sent. Connect Firebase Authentication to enable this feature.';
    });

    document.getElementById('google-button').addEventListener('click', () => {
      message.textContent = 'Google sign-in is not configured yet. Connect Firebase Authentication to open the Google account chooser securely.';
    });
  </script>
</body>
</html>
